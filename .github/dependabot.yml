# Proposes the dependency updates each month: minor and patch versions grouped, one pull request per ecosystem
# (so one CI run each); a major version comes alone, to be tried on a branch first (golden rules).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      all:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      dev-tooling:
        patterns: ["*"]
        update-types: [minor, patch]
